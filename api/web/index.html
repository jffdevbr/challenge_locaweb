<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel · Previsão de incidentes</title>
  <link rel="icon" href="/static/marca/logo.svg">
  <link rel="stylesheet" href="/static/marca.css">
  <link rel="stylesheet" href="/static/estilo.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body class="pagina-painel">
  <header class="topo">
    <a class="marca-assinatura" href="/">
      <img class="marca-logo" src="/static/marca/logo.svg" alt="">
      <span class="marca-nome">Previsão de incidentes</span>
    </a>
    <nav class="navegacao" aria-label="Páginas">
      <a href="/" aria-current="page">Painel</a>
      <a href="/detalhe">Detalhes</a>
    </nav>
  </header>

  <main>
    <div class="filtros">
      <div class="grupo-chips" role="group" aria-label="Data de origem">
        <label class="rotulo-filtro" for="data">Hoje é</label>
        <button type="button" class="passo" id="dia-anterior" aria-label="Dia anterior">‹</button>
        <!-- min/max são sobrescritos pelo intervalo que a API devolve. -->
        <input type="date" id="data" value="2025-12-31" min="2025-09-01" max="2025-12-31">
        <button type="button" class="passo" id="dia-seguinte" aria-label="Dia seguinte">›</button>
        <span class="situacao" id="situacao"></span>
      </div>
      <div class="grupo-chips" id="f-prioridade" role="group" aria-label="Prioridade">
        <span class="rotulo-filtro">Prioridade</span>
        <button type="button" data-valor="2">P2</button>
        <button type="button" data-valor="3">P3</button>
        <button type="button" data-valor="4">P4</button>
      </div>
    </div>

    <p class="erro" id="erro" hidden></p>

    <div class="tiles" id="numeros"></div>

    <div class="painel-grade">
      <div class="coluna-graficos">
        <section>
          <h2>Amanhã · D+1</h2>
          <p class="subtitulo" id="sub-d1">—</p>
          <div class="grafico-caixa">
            <canvas id="grafico-d1" role="img" aria-label="Incidentes abertos por dia, com e sem intervenção empilhados, e a previsão do dia seguinte"></canvas>
          </div>
          <details>
            <summary>Ver em tabela</summary>
            <div class="rolagem" id="tabela-d1"></div>
          </details>
        </section>

        <section>
          <h2>Próxima semana · D+7</h2>
          <p class="subtitulo" id="sub-d7">—</p>
          <div class="grafico-caixa">
            <canvas id="grafico-d7" role="img" aria-label="Incidentes abertos por semana, com e sem intervenção empilhados, e a previsão da próxima semana"></canvas>
          </div>
          <details>
            <summary>Ver em tabela</summary>
            <div class="rolagem" id="tabela-d7"></div>
          </details>
        </section>
      </div>

      <section>
        <h2>Chance de quebra dos KPIs de OLA</h2>
        <p class="subtitulo" id="sub-kpis">—</p>
        <div id="kpis"></div>
      </section>
    </div>
  </main>

  <footer class="rodape">
    Metodologia, desempenho de cada modelo, o modelo total e qualquer data do histórico em
    <a href="/detalhe">Detalhes</a>.
  </footer>

  <script src="/static/painel.js"></script>
</body>
</html>
